<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>送个音宝的小心心❤️</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at 30% 30%, #1f2937 0%, #0f172a 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
                  "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }

  /* 每一条小提醒卡片 */
  .bubble {
    position: absolute;
    max-width: 200px;
    background: rgba(30,41,59,0.85);
    border: 1px solid rgba(255,255,255,0.08);
    color: #e2e8f0;
    border-radius: 1rem;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.8),
      0 0 30px rgba(56,189,248,0.3);
    padding: .8rem 1rem .7rem;
    font-size: .8rem;
    line-height: 1.4;
    z-index: 10;
    pointer-events: none;

    opacity: 0;
    transform: translateY(10px) scale(.9);
    /* 我们不会一开始就放动画，它会在我们append后手动触发fadeIn类 */
  }

  .bubble.show {
    animation: fadeIn .5s cubic-bezier(.2,1.4,.4,1) forwards;
  }

  /* 这些卡片在飞向爱心时会用到这个过渡动画（统一2秒） */
  .bubble.fly {
    transition: left 2s ease-in-out, top 2s ease-in-out;
  }

  /* 卡片标题行 */
  .bubble-head {
    display: flex;
    align-items: center;
    gap: .4rem;
    font-size: .7rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: .4rem;
    letter-spacing: -0.03em;
    line-height: 1.2;
  }

  .dot {
    width: .5rem;
    height: .5rem;
    border-radius: 999px;
    background: radial-gradient(circle,#38bdf8 0%,rgba(56,189,248,0)70%);
    box-shadow: 0 0 10px #38bdf8;
    flex-shrink: 0;
  }

  .bubble-msg {
    color: #cbd5e1;
    white-space: pre-line;
    word-break: break-word;
  }

  @keyframes fadeIn {
    0% {
      opacity: 0;
      transform: translateY(10px) scale(.9);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* 屏幕中央的最终区域（爱心+打字+点击提示） */
  .final-wrapper {
    position: absolute;
    left: 50%;
    top: 50%;
    translate: -50% -50%;
    text-align: center;
    color: #fff;
    z-index: 20;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 点击提示（在所有卡片都出现后才显示） */
  .tap-hint {
    font-size: .9rem;
    line-height: 1.4;
    color: #94a3b8;
    text-shadow: 0 0 10px rgba(0,0,0,.6);
    opacity: 0;
    user-select: none;
    -webkit-user-select: none;
    transition: opacity .6s ease;
  }

  .tap-hint.visible {
    opacity: 0.7;
  }

  .tap-hint.hide {
    opacity: 0;
    transition: opacity .4s ease;
  }

  /* 大爱心符号（在飞行后才显现） */
  .final-heart {
    font-size: 2rem;
    line-height: 1;
    color: #ff4d6a;
    text-shadow: 0 0 20px rgba(255,77,106,.6), 0 0 40px rgba(255,77,106,.4);
    margin-top: 1rem;
    margin-bottom: .75rem;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }

  /* 打字机区域的文案（最后才出现） */
  .final-text {
    font-size: 1rem;
    line-height: 1.5;
    font-weight: 500;
    letter-spacing: -0.03em;
    color: #fff;
    min-height: 3em; /* 占位避免跳动 */
    opacity: 0;
    transition: opacity .6s ease;
  }

  .caret {
    display: inline-block;
    width: .6em;
    color: #ff4d6a;
    text-shadow: 0 0 10px rgba(255,77,106,.7);
    opacity: 0;
    animation: blink 0.8s steps(1) infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

</style>
</head>
<body>

<!-- 中央区域（先只当“提示的位置保护区”，卡片禁止重叠这里） -->
<div class="final-wrapper">
  <div id="tapHint" class="tap-hint">轻点屏幕一下 🫶<br/>我有话想跟你说</div>

  <div id="finalHeart" class="final-heart">❤</div>

  <div id="finalText" class="final-text">
    <span id="typed"></span><span id="caret" class="caret">|</span>
  </div>
</div>

<script>
  /***********************
   * 1. 配置区：可以改内容
   ***********************/
  const MESSAGES = [
    "早点休息 🌙 别再熬夜啦",
    "到家记得报平安 ❤️ 我会担心",
    "水！喝水！不是奶茶 是水 💧",
    "肩膀放松一下 低头太久会酸 👀",
    "今天已经很努力了 不要骂自己 🙌",
    "冷了要穿外套 不要逞强 🧥",
    "钥匙 / 钱包 / 卡 都带了吗 ✅",
    "睡前别一直刷手机 好吗 📱💤",
    "记得吃点热的 对胃好 🍜",
    "不开心的时候 你可以跟我说 🫂",
    "你是很重要的人 真的 不是客气 💖",
    "慢一点没关系 你不需要每一秒都坚强 🌟",
    "别独自扛住所有事情 我想陪你 🤍",
    "闭眼深呼吸一下 一切会慢慢好起来",
    "谢谢你一直撑到现在 我看见了"
  ];

  // 生成多少个气泡（可以改成比消息更多，比如 40，会循环用这些话）
  const BUBBLE_COUNT = MESSAGES.length;

  // 爱心汇聚后显示的最后的话（会打字机效果）
  const FINAL_MESSAGE = "享受生活。\n不许自己吓自己。";

  // 每个卡片出现之间的延迟（毫秒）
  const BUBBLE_INTERVAL = 200; // 0.2秒一条，慢慢出现

  // 飞行动画时间 (ms)，要和CSS里 .bubble.fly 的transition时长一致 (2s)
  const FLY_TIME = 2000;

  // 状态
  let hasStarted = false;     // 防止重复点击
  let allSpawned = false;     // 全部卡片出现后才允许点击
  const bubbles = [];         // 保存卡片信息

  /***********************
   * 2. 工具函数
   ***********************/
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // 安全显示文本并支持 \n
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;")
      .replace(/\n/g, "<br/>");
  }

  // 矩形碰撞检测（避免重叠）
  function isOverlapping(newRect, rects) {
    for (const r of rects) {
      const overlapX = !(newRect.right < r.left || newRect.left > r.right);
      const overlapY = !(newRect.bottom < r.top || newRect.top > r.bottom);
      if (overlapX && overlapY) return true;
    }
    return false;
  }

  // 给定一个bubble元素，尝试放到屏幕上不重叠、而且不挡住中央提示区域
  function placeNonOverlapping(bubble, avoidRect) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const bw = bubble.offsetWidth;
    const bh = bubble.offsetHeight;

    // 现有的卡片矩形
    const existingRects = bubbles.map(b => ({
      left: b.left,
      top: b.top,
      right: b.left + b.width,
      bottom: b.top + b.height
    }));

    // 避免中央提示区域（tapHint区域附近）
    // 我们额外给它加一点安全边距 20px
    const avoid = {
      left:   avoidRect.left - 20,
      top:    avoidRect.top - 20,
      right:  avoidRect.right + 20,
      bottom: avoidRect.bottom + 20
    };

    function overlapsAvoidZone(rect) {
      const overlapX = !(rect.right < avoid.left || rect.left > avoid.right);
      const overlapY = !(rect.bottom < avoid.top || rect.top > avoid.bottom);
      return overlapX && overlapY;
    }

    for (let attempt = 0; attempt < 80; attempt++) {
      const x = randInt(30, Math.max(30, vw - bw - 30));
      const y = randInt(30, Math.max(30, vh - bh - 30));

      const trialRect = {
        left: x,
        top: y,
        right: x + bw,
        bottom: y + bh
      };

      if (overlapsAvoidZone(trialRect)) {
        continue; // 别挡提示语区域
      }

      if (!isOverlapping(trialRect, existingRects)) {
        bubble.style.left = x + "px";
        bubble.style.top  = y + "px";
        return { left: x, top: y, width: bw, height: bh };
      }
    }

    // 实在放不下就妥协随机放，不考虑重叠了（极端情况）
    const fallbackX = randInt(30, Math.max(30, vw - bw - 30));
    const fallbackY = randInt(30, Math.max(30, vh - bh - 30));
    bubble.style.left = fallbackX + "px";
    bubble.style.top  = fallbackY + "px";

    return { left: fallbackX, top: fallbackY, width: bw, height: bh };
  }

  /***********************
   * 3. 心形目标布局
   ***********************/
  function generateHeartPositions(n) {
    // 参数方程心形
    // x = 16 sin^3 t
    // y = 13 cos t - 5 cos 2t - 2 cos 3t - cos 4t
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = (i / n) * 2 * Math.PI;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t)
              - 5 * Math.cos(2 * t)
              - 2 * Math.cos(3 * t)
              - Math.cos(4 * t);
      pts.push({ x, y });
    }

    // 原始心形范围估计: 宽~32, 高~30
    const BASE_W = 32;
    const BASE_H = 30;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // 心形大小占屏幕40%
    const targetW = vw * 0.4;
    const targetH = vh * 0.4;

    const scaleX = targetW / BASE_W;
    const scaleY = targetH / BASE_H;
    const scale = Math.min(scaleX, scaleY);

    const cx = vw / 2;
    const cy = vh / 2;

    return pts.map(p => ({
      left: cx + p.x * scale,
      top : cy - p.y * scale
    }));
  }

  /***********************
   * 4. 开始飞向心形 (在点击后才触发)
   ***********************/
  function animateToHeartAndThenType() {
    const tapHint = document.getElementById("tapHint");
    if (tapHint) {
      tapHint.classList.add("hide"); // 点击后淡出提示
    }

    const heartSpots = generateHeartPositions(bubbles.length);

    // 给所有卡片加上 .fly（有transition），然后设定目标位置
    bubbles.forEach((bObj, i) => {
      const spot = heartSpots[i % heartSpots.length];
      const bw = bObj.el.offsetWidth;
      const bh = bObj.el.offsetHeight;

      const finalLeft = spot.left - bw / 2;
      const finalTop  = spot.top  - bh / 2;

      bObj.el.classList.add("fly");
      bObj.el.style.left = finalLeft + "px";
      bObj.el.style.top  = finalTop  + "px";
    });

    // 飞行动画结束后开始打字
    setTimeout(() => {
      typeWriterEffect(FINAL_MESSAGE, 60);
    }, FLY_TIME);
  }

  /***********************
   * 5. 打字机效果 + 打完隐藏光标
   ***********************/
  function typeWriterEffect(text, speedMs=60) {
    const typedEl  = document.getElementById("typed");
    const caretEl  = document.getElementById("caret");
    const heartEl  = document.getElementById("finalHeart");
    const textWrap = document.getElementById("finalText");

    let idx = 0;
    typedEl.textContent = "";

    // 爱心 & 文本整体先淡入
    heartEl.style.opacity = 1;
    textWrap.style.opacity = 1;
    caretEl.style.opacity = 1;

    function step() {
      if (idx <= text.length) {
        const current = text.slice(0, idx).replace(/\n/g, "<br/>");
        typedEl.innerHTML = current;
        idx++;
        setTimeout(step, speedMs);
      } else {
        // 打完后隐藏光标
        caretEl.style.display = "none";
      }
    }
    step();
  }

  /***********************
   * 6. 按顺序一个一个生成卡片
   *   - 每隔 BUBBLE_INTERVAL ms 出现一个
   *   - 全部出现完后才显示提示 “轻点屏幕…”
   ***********************/
  function spawnBubblesSequentially() {
    const tapHintEl = document.getElementById("tapHint");

    // 我们要保护的中心区域（点击提示的位置），不让卡片出现在这里
    const hintRect = tapHintEl.getBoundingClientRect();

    let index = 0;

    function spawnNext() {
      if (index >= BUBBLE_COUNT) {
        // 全部生成完毕
        allSpawned = true;
        // 这时候才让“轻点屏幕”这句出现
        tapHintEl.classList.add("visible");
        return;
      }

      const msg = MESSAGES[index % MESSAGES.length];

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `
        <div class="bubble-head">
          <div class="dot"></div>
          <div>温馨提醒</div>
        </div>
        <div class="bubble-msg">${escapeHtml(msg)}</div>
      `;
      document.body.appendChild(bubble);

      // 现在 bubble 在 DOM 里，才有 offsetWidth/Height
      const placed = placeNonOverlapping(bubble, hintRect);

      bubbles.push({
        el: bubble,
        left: placed.left,
        top: placed.top,
        width: placed.width,
        height: placed.height
      });

      // 让它触发出现动画
      requestAnimationFrame(() => {
        bubble.classList.add("show");
      });

      index++;
      setTimeout(spawnNext, BUBBLE_INTERVAL);
    }

    spawnNext();
  }

  /***********************
   * 7. 点击触发汇聚成爱心
   ***********************/
  function handleStart() {
    // 只有当所有卡片都已经出现(allSpawned)并且还没开始过(hasStarted=false)时才允许
    if (!allSpawned || hasStarted) return;
    hasStarted = true;
    animateToHeartAndThenType();
  }

  window.addEventListener("click", handleStart);
  window.addEventListener("touchstart", handleStart, {passive: true});

  /***********************
   * 8. 页面加载后开始按顺序生成卡片
   ***********************/
  window.addEventListener("load", () => {
    spawnBubblesSequentially();
  });
</script>
</body>
</html>
